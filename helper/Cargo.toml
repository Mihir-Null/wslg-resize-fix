[package]
name = "wslg-resize-sync"
version = "0.1.0"
edition = "2021"
description = "Tell WSLg's Weston when an external Windows WM moves/resizes a WSLg window"
license = "MIT"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# A panic unwinding across the extern "system" callbacks is UB; abort instead.
panic = "abort"
